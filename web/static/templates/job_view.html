<div id="map-modal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="map-modal-title" onclick="if(event.target===this)closeJobMap()">
    <div class="modal-content-lg">
        <div class="modal-header">
            <h2 id="map-modal-title">Resultados de Leads</h2>
            <button type="button" class="drawer-close-btn" id="close-modal-btn" aria-label="Fechar" onclick="closeJobMap()">&times;</button>
        </div>
        <div class="explorer-container">
            <div id="job-places-list">
                <div class="places-filter-bar">
                    <input type="text" id="lead-filter-input" placeholder="🔍 Buscar leads por nome, categoria, endereço..." class="input-search" style="width: 100%; height: 34px;" />
                </div>
                <div id="lead-cards-container" class="places-cards-scroll"></div>
            </div>
            <div id="job-map"></div>
            <div id="job-details-panel">
                <div id="details-empty-state" class="empty-state" style="padding-top: 3rem;">
                    <svg width="40" height="40" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                    <p style="font-size: 0.9rem; color: var(--color-text-muted);">Selecione um lead da lista ou do mapa para ver os detalhes completos.</p>
                </div>
                <div id="details-content" style="display:none;"></div>
            </div>
        </div>
    </div>
    <script>
    (function () {
        var places = {{ . }};
        var LEAFLET_CSS = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css';
        var LEAFLET_JS = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js';

        var leafletMap = null;
        var markersMap = new Map();

        if (Array.isArray(places)) {
            places.forEach(function (p, idx) {
                p._index = idx;
            });
        } else {
            places = [];
        }

        function ensureLeaflet(callback) {
            if (window.L) {
                callback();
                return;
            }

            if (!document.getElementById('leaflet-css')) {
                var link = document.createElement('link');
                link.id = 'leaflet-css';
                link.rel = 'stylesheet';
                link.href = LEAFLET_CSS;
                document.head.appendChild(link);
            }

            var script = document.getElementById('leaflet-js');
            if (!script) {
                script = document.createElement('script');
                script.id = 'leaflet-js';
                script.src = LEAFLET_JS;
                document.head.appendChild(script);
            }

            script.addEventListener('load', callback);
        }

        function escapeHtml(str) {
            var div = document.createElement('div');
            div.textContent = str == null ? '' : str;
            return div.innerHTML;
        }

        function createMap() {
            if (window.__jobMap) {
                window.__jobMap.remove();
            }

            var map = L.map('job-map');
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '© OpenStreetMap'
            }).addTo(map);

            window.__jobMap = map;
            leafletMap = map;
            return map;
        }

        function placePopup(place) {
            var parts = ['<strong>' + escapeHtml(place.title) + '</strong>'];
            if (place.category) {
                parts.push('<small style="color:#475569;">' + escapeHtml(place.category) + '</small>');
            }
            if (place.address) {
                parts.push(escapeHtml(place.address));
            }
            if (place.phone) {
                parts.push('📞 ' + escapeHtml(place.phone));
            }
            return parts.join('<br>');
        }

        function placeListItem(place, onSelect) {
            var item = document.createElement('div');
            item.className = 'place-card';
            item.id = 'place-card-' + place._index;

            var html = [];
            html.push('<div class="place-card-title">' + escapeHtml(place.title) + '</div>');
            if (place.category) {
                html.push('<span class="place-card-category">' + escapeHtml(place.category) + '</span>');
            }
            if (place.address) {
                html.push('<div class="place-card-address">' + escapeHtml(place.address) + '</div>');
            }
            if (place.review_rating) {
                html.push('<div style="font-size: 0.8rem; color: #d97706; font-weight: 600; margin-top: 0.25rem;">★ ' + escapeHtml(String(place.review_rating)));
                if (place.review_count) {
                    html.push(' <span style="color: #64748b; font-weight: normal;">(' + escapeHtml(String(place.review_count)) + ')</span>');
                }
                html.push('</div>');
            }

            html.push('<div class="place-card-badges">');
            if (place.emails && place.emails.length > 0) {
                html.push('<span class="badge-tag has-email">✉ Email</span>');
            }
            if (place.phone) {
                html.push('<span class="badge-tag">📞 Telefone</span>');
            }
            html.push('</div>');

            item.innerHTML = html.join('');
            item.addEventListener('click', onSelect);
            return item;
        }

        function selectPlace(place, triggerSource) {
            document.querySelectorAll('.place-card').forEach(function (el) {
                el.classList.remove('active');
            });
            var cardEl = document.getElementById('place-card-' + place._index);
            if (cardEl) {
                cardEl.classList.add('active');
                if (triggerSource === 'map') {
                    cardEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }
            }

            if (place.latitude && place.longitude && leafletMap) {
                var latlng = [place.latitude, place.longitude];
                if (triggerSource === 'list') {
                    leafletMap.setView(latlng, 16);
                }
                var marker = markersMap.get(place._index);
                if (marker) {
                    marker.openPopup();
                }
            }

            renderLeadDetails(place);
        }

        function renderLeadDetails(place) {
            var panelEl = document.getElementById('details-content');
            var emptyEl = document.getElementById('details-empty-state');
            if (!panelEl) return;

            emptyEl.style.display = 'none';
            panelEl.style.display = 'block';

            var html = [];
            html.push('<h3 class="details-title" id="detail-title">' + escapeHtml(place.title) + '</h3>');
            if (place.category) {
                html.push('<span class="place-card-category" style="margin-bottom: 0.75rem;">' + escapeHtml(place.category) + '</span>');
            }
            if (place.review_rating) {
                html.push('<div style="font-size: 0.9rem; color: #d97706; font-weight: 600; margin-bottom: 0.85rem;">★ ' + escapeHtml(String(place.review_rating)));
                if (place.review_count) {
                    html.push(' <span style="color: #64748b; font-weight: normal;">(' + escapeHtml(String(place.review_count)) + ' avaliações)</span>');
                }
                html.push('</div>');
            }

            // Quick Actions
            html.push('<div class="details-actions">');
            if (place.website) {
                var webUrl = place.website.startsWith('http') ? place.website : 'http://' + place.website;
                html.push('<a href="' + encodeURI(webUrl) + '" target="_blank" rel="noopener noreferrer" class="btn btn-sm btn-outline">🌐 Website</a>');
            }
            if (place.link && /^https?:\/\//i.test(place.link)) {
                html.push('<a href="' + encodeURI(place.link) + '" target="_blank" rel="noopener noreferrer" class="btn btn-sm btn-outline">📍 Google Maps</a>');
            }
            if (place.street_view_url && /^https?:\/\//i.test(place.street_view_url)) {
                html.push('<a href="' + encodeURI(place.street_view_url) + '" target="_blank" rel="noopener noreferrer" class="btn btn-sm btn-outline">📷 Street View</a>');
            }
            html.push('</div>');

            // Contact Info
            html.push('<div class="details-section">');
            html.push('<h4>Informações de Contato</h4>');
            if (place.phone) {
                html.push('<div style="margin-bottom:0.35rem;"><strong>Telefone:</strong> <a href="tel:' + escapeHtml(place.phone) + '">' + escapeHtml(place.phone) + '</a></div>');
            }
            if (place.emails && place.emails.length > 0) {
                html.push('<div style="margin-bottom:0.35rem;"><strong>E-mails:</strong> ');
                place.emails.forEach(function (em) {
                    html.push('<a href="mailto:' + escapeHtml(em) + '" class="badge-tag has-email">' + escapeHtml(em) + '</a> ');
                });
                html.push('</div>');
            }
            if (place.address) {
                html.push('<div style="margin-bottom:0.35rem;"><strong>Endereço:</strong> ' + escapeHtml(place.address) + '</div>');
            }
            if (place.plus_code) {
                html.push('<div style="margin-bottom:0.35rem;"><strong>Plus Code:</strong> ' + escapeHtml(place.plus_code) + '</div>');
            }
            if (place.status) {
                html.push('<div style="margin-bottom:0.35rem;"><strong>Status:</strong> ' + escapeHtml(place.status) + '</div>');
            }
            if (place.price_range) {
                html.push('<div style="margin-bottom:0.35rem;"><strong>Faixa de preço:</strong> ' + escapeHtml(place.price_range) + '</div>');
            }
            html.push('</div>');

            // Open Hours
            if (place.open_hours) {
                html.push('<div class="details-section">');
                html.push('<h4>Horário de funcionamento</h4>');
                html.push('<div style="font-size: 0.85rem; color: var(--color-text-main);">' + formatOpenHours(place.open_hours) + '</div>');
                html.push('</div>');
            }

            // Description
            if (place.description) {
                html.push('<div class="details-section">');
                html.push('<h4>Descrição</h4>');
                html.push('<p style="font-size: 0.85rem; color: var(--color-text-muted);">' + escapeHtml(place.description) + '</p>');
                html.push('</div>');
            }

            // Credit Cards
            if (place.credit_cards_accepted && place.credit_cards_accepted.length > 0) {
                html.push('<div class="details-section">');
                html.push('<h4>Cartões de crédito aceitos</h4>');
                html.push('<div>');
                var ccList = Array.isArray(place.credit_cards_accepted) ? place.credit_cards_accepted : [String(place.credit_cards_accepted)];
                ccList.forEach(function (card) {
                    html.push('<span class="badge-tag">' + escapeHtml(card) + '</span> ');
                });
                html.push('</div></div>');
            }

            panelEl.innerHTML = html.join('');
        }

        function formatOpenHours(hours) {
            if (typeof hours === 'string') return escapeHtml(hours);
            if (typeof hours === 'object' && hours !== null) {
                var rows = [];
                for (var day in hours) {
                    var times = hours[day];
                    var timeStr = Array.isArray(times) ? times.join(', ') : String(times);
                    rows.push('<div><strong>' + escapeHtml(day) + ':</strong> ' + escapeHtml(timeStr) + '</div>');
                }
                return rows.join('');
            }
            return '';
        }

        function renderPlaces(map, cardsContainer) {
            var bounds = [];
            cardsContainer.innerHTML = '';
            markersMap.clear();

            places.forEach(function (place) {
                var card = placeListItem(place, function () {
                    selectPlace(place, 'list');
                });
                cardsContainer.appendChild(card);

                if (place.latitude && place.longitude) {
                    var latlng = [place.latitude, place.longitude];
                    bounds.push(latlng);

                    var marker = L.marker(latlng).bindPopup(placePopup(place)).addTo(map);
                    marker.on('click', function () {
                        selectPlace(place, 'map');
                    });
                    markersMap.set(place._index, marker);
                }
            });

            if (bounds.length > 0) {
                map.fitBounds(bounds, { padding: [30, 30] });
            }
            setTimeout(function () { map.invalidateSize(); }, 0);

            if (places.length > 0) {
                selectPlace(places[0], 'init');
            }
        }

        function showEmptyState(map, cardsContainer) {
            cardsContainer.innerHTML = '<div style="padding: 2rem; text-align: center; color: var(--color-text-muted);">Nenhum lead encontrado nesta pesquisa.</div>';
            map.setView([0, 0], 2);
        }

        function initJobMap() {
            var cardsContainer = document.getElementById('lead-cards-container');
            var map = createMap();

            if (places.length === 0) {
                showEmptyState(map, cardsContainer);
                return;
            }

            renderPlaces(map, cardsContainer);

            var filterInput = document.getElementById('lead-filter-input');
            if (filterInput) {
                filterInput.addEventListener('input', function (e) {
                    var query = e.target.value.toLowerCase().trim();
                    places.forEach(function (place) {
                        var card = document.getElementById('place-card-' + place._index);
                        var match = !query ||
                            (place.title && place.title.toLowerCase().includes(query)) ||
                            (place.category && place.category.toLowerCase().includes(query)) ||
                            (place.phone && place.phone.toLowerCase().includes(query)) ||
                            (place.address && place.address.toLowerCase().includes(query));

                        if (card) {
                            card.style.display = match ? 'block' : 'none';
                        }
                    });
                });
            }
        }

        window.closeJobMap = function () {
            if (window.__jobMap) {
                window.__jobMap.remove();
                window.__jobMap = null;
            }

            var container = document.getElementById('map-modal-container');
            if (container) {
                container.innerHTML = '';
            }
        };

        ensureLeaflet(initJobMap);
    })();
    </script>
</div>
