openapi: 3.0.3
info:
  title: Central de Leads API
  version: 1.0.0
  description: API para pesquisas e leads. A conta inicial é criada uma única vez em /api/v1/auth/setup; depois, use /api/v1/auth/login. As senhas ficam armazenadas como hashes no backend SQLite. O token de acesso expira em 30 dias.

servers:
  - url: /
    description: Mesmo servidor da documentação

security:
  - BearerAuth: []

paths:
  /api/v1/auth/setup:
    post:
      security: []
      summary: Create the first API account
      description: One-time bootstrap endpoint. Available only while no API account exists. Saves the email and a bcrypt password hash in the backend SQLite database and returns a 30-day bearer token.
      operationId: setupApiAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialsRequest'
            example:
              email: joel.quintana@iainfinito.com.br
              password: replace-with-your-own-strong-password
      responses:
        '200':
          description: Account created; bearer token returned once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountTokenResponse'
        '400':
          description: Invalid JSON request.
        '409':
          description: Initial account was already created.
        '422':
          description: Invalid email or password.
        '503':
          description: Persistent account storage or JWT authentication is unavailable.
  /api/v1/auth/login:
    post:
      security: []
      summary: Sign in and create a 30-day access token
      description: Autentica a conta existente usando e-mail e senha e retorna um bearer token válido por 30 dias. Use esse token no cabeçalho Authorization para acessar os endpoints protegidos.
      operationId: loginApiAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialsRequest'
            example:
              email: joel.quintana@iainfinito.com.br
              password: your-account-password
      responses:
        '200':
          description: Credentials accepted; bearer token returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountTokenResponse'
        '400':
          description: Invalid JSON request.
        '401':
          description: Email or password is incorrect.
        '422':
          description: Invalid email or password format.
        '503':
          description: Persistent account storage is unavailable.
  /api/v1/tokens:
    post:
      summary: Generate a scoped API and MCP access token
      description: Issues a bearer JWT for up to 30 days. Requires an existing account JWT with the `token:issue` scope. The returned token is shown once; store it securely. Allowed scopes are `read`, `write`, `delete`, and `token:issue`.
      operationId: createAccessToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTokenRequest'
            example:
              subject: stark-agent
              scopes: [read, write]
              ttl: 720h
      responses:
        '201':
          description: Token created. The access token is returned only in this response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateTokenResponse'
        '400':
          description: Invalid JSON or token lifetime format.
        '401':
          description: Bearer JWT absent, invalid, or expired.
        '403':
          description: The caller JWT does not have the token:issue scope.
        '422':
          description: Invalid subject, scope, or lifetime.
        '503':
          description: JWT authentication is not configured.

  /api/v1/jobs:
    post:
      summary: Create a new job scraping task
      description: Cria uma tarefa de pesquisa no Google Maps com as palavras-chave e os parâmetros enviados. A tarefa é enfileirada para processamento; a resposta retorna o identificador para acompanhar o status e consultar os resultados depois.
      x-code-samples:
        - lang: curl
          source: |
            curl -X POST "http://localhost:8080/api/v1/jobs" \
              -H "Content-Type: application/json" \
              -d '{
                "name": "Coffee shops Ilion",
                "keywords": ["coffee in ilion"],
                "lang": "el",
                "zoom": 15,
                "depth": 1,
                "max_time": 3600
              }'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiScrapeRequest'
      responses:
        '201':
          description: Job created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiScrapeResponse'
        '422':
          description: Unprocessable entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

    get:
      summary: Get all jobs
      description: Retorna as tarefas de pesquisa registradas, incluindo identificador, nome, data, status e parâmetros de cada tarefa.
      x-code-samples:
        - lang: curl
          source: |
            curl -X GET "http://localhost:8080/api/v1/jobs"
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Job'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/v1/leads:
    get:
      summary: Listar leads consolidados
      description: Retorna leads globais paginados, deduplicados por identificador do lugar. Usa os resultados CSV e pesquisas SQLite no modo local, ou a fonte PostgreSQL no modo database.
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Página de leads
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalLeadsPage'
        '500':
          description: Falha ao consultar a fonte de dados configurada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/v1/jobs/{id}:
    get:
      summary: Get a specific job
      description: Consulta uma tarefa pelo identificador e retorna seus dados, parâmetros e status atual. Use o identificador recebido ao criar a tarefa.
      x-code-samples:
        - lang: curl
          source: |
            curl -X GET "http://localhost:8080/api/v1/jobs/6f0c1af8-3c4e-4742-84bb-590938ae8930"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '404':
          description: Job not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: Invalid ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

    delete:
      summary: Delete a specific job
      description: Exclui a tarefa identificada e seus dados associados do armazenamento configurado. A operação exige um token com o escopo `delete`.
      x-code-samples:
        - lang: curl
          source: |
            curl -X DELETE "http://localhost:8080/api/v1/jobs/455a6a00-cefb-4a9d-9e7d-791f01873700"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Job deleted successfully
        '422':
          description: Invalid ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/v1/jobs/{id}/download:
    get:
      summary: Download job results as CSV
      description: Baixa em formato CSV os resultados gerados por uma tarefa concluída. O arquivo só fica disponível depois que o processamento produzir os resultados.
      x-code-samples:
          source: |
            curl -X GET "http://localhost:8080/api/v1/jobs/18eafda3-53a9-4970-ac96-8f8dfc7011c3/download" --output results.csv
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            text/csv:
              schema:
                type: string
                format: binary
        '404':
          description: File not found
        '422':
          description: Invalid ID
        '500':
          description: Internal server error

  /mcp:
    post:
      summary: MCP Streamable HTTP endpoint
      description: |-
        Endpoint MCP para conectar agentes e clientes compatíveis. Envie mensagens JSON-RPC 2.0 no corpo, incluindo `initialize`, `tools/list` e `tools/call`. O bearer JWT é obrigatório e deve incluir o escopo da ferramenta chamada. `create_job` exige `write`; consultas e download exigem `read`; `delete_job` exige `delete`. Para iniciar, envie `initialize` com `protocolVersion`, `capabilities` e `clientInfo`; reutilize o `Mcp-Session-Id` retornado nas solicitações seguintes e envie `MCP-Protocol-Version`.
      operationId: mcpStreamableHttp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MCPJSONRPCRequest'
            examples:
              initialize:
                summary: Inicializar uma sessão MCP
                value:
                  jsonrpc: '2.0'
                  id: 1
                  method: initialize
                  params:
                    protocolVersion: '2025-03-26'
                    capabilities: {}
                    clientInfo:
                      name: meu-agente
                      version: '1.0.0'
              listTools:
                summary: Listar as ferramentas disponíveis
                value:
                  jsonrpc: '2.0'
                  id: 2
                  method: tools/list
                  params: {}
              callTool:
                summary: Invocar uma ferramenta MCP
                value:
                  jsonrpc: '2.0'
                  id: 3
                  method: tools/call
                  params:
                    name: list_jobs
                    arguments: {}
      responses:
        '200':
          description: Resposta JSON-RPC ou fluxo Server-Sent Events, conforme Accept.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MCPJSONRPCResponse'
            text/event-stream:
              schema:
                type: string
        '202':
          description: Notificação JSON-RPC aceita sem corpo de resposta.
        '400':
          description: Requisição MCP inválida ou versão de protocolo ausente.
        '401':
          description: Bearer JWT ausente, inválido ou expirado.
        '403':
          description: O JWT não contém o escopo necessário para a ferramenta.
        '404':
          description: Sessão MCP desconhecida ou encerrada.
        '406':
          description: O cabeçalho Accept não oferece JSON nem Server-Sent Events.
        '503':
          description: Autenticação MCP ainda não configurada no servidor.
    get:
      summary: Abrir fluxo MCP Server-Sent Events
      description: Abre o fluxo de eventos da sessão MCP identificada por `Mcp-Session-Id`.
      parameters:
        - name: Mcp-Session-Id
          in: header
          required: true
          schema:
            type: string
        - name: MCP-Protocol-Version
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Fluxo de eventos MCP.
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          description: Bearer JWT ausente, inválido ou expirado.
        '404':
          description: Sessão MCP desconhecida ou encerrada.
    delete:
      summary: Encerrar sessão MCP
      parameters:
        - name: Mcp-Session-Id
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Sessão encerrada.
        '401':
          description: Bearer JWT ausente, inválido ou expirado.
        '404':
          description: Sessão MCP desconhecida ou encerrada.

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    CreateTokenRequest:
      type: object
      required: [subject, scopes]
      properties:
        subject:
          type: string
          description: Name identifying the agent that will use the token.
          example: stark-agent
        scopes:
          type: array
          minItems: 1
          items:
            type: string
            enum: [read, write, delete, token:issue]
        ttl:
          type: string
          default: 720h
          description: Go duration from 1 second up to 720 hours (30 days), for example 30m or 720h.
    CredentialsRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: joel.quintana@iainfinito.com.br
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 72
          description: Chosen by the user; stored only as a bcrypt hash.
    AccountTokenResponse:
      type: object
      required: [access_token, token_type, subject, scopes, expires_at]
      properties:
        access_token:
          type: string
          format: password
          description: Bearer JWT, returned once and valid for 30 days.
        token_type:
          type: string
          enum: [Bearer]
        subject:
          type: string
          format: email
        scopes:
          type: array
          items:
            type: string
        expires_at:
          type: string
          format: date-time
    CreateTokenResponse:
      type: object
      required: [access_token, token_type, subject, scopes, expires_at]
      properties:
        access_token:
          type: string
          format: password
          description: Bearer JWT. Treat as a secret.
        token_type:
          type: string
          enum: [Bearer]
        subject:
          type: string
        scopes:
          type: array
          items:
            type: string
        expires_at:
          type: string
          format: date-time
    MCPJSONRPCRequest:
      type: object
      required: [jsonrpc, method]
      properties:
        jsonrpc:
          type: string
          enum: ['2.0']
        id:
          oneOf:
            - type: string
            - type: integer
        method:
          type: string
          example: tools/list
        params:
          type: object
          additionalProperties: true
      additionalProperties: true
    MCPJSONRPCResponse:
      type: object
      properties:
        jsonrpc:
          type: string
          enum: ['2.0']
        id:
          oneOf:
            - type: string
            - type: integer
            - type: 'null'
        result:
          type: object
          additionalProperties: true
        error:
          type: object
          additionalProperties: true
      additionalProperties: true
    GlobalLeadsPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Place'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    Place:
      type: object
      properties:
        place_id:
          type: string
        title:
          type: string
        address:
          type: string
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        link:
          type: string
          format: uri
        category:
          type: string
        phone:
          type: string
        website:
          type: string
          format: uri
        review_rating:
          type: number
          format: double
        review_count:
          type: integer
        emails:
          type: array
          items:
            type: string
            format: email
        job_id:
          type: string
        job_name:
          type: string

    ApiError:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string

    ApiScrapeRequest:
      type: object
      properties:
        name:
          type: string
        keywords:
          type: array
          items:
            type: string
        lang:
          type: string
        zoom:
          type: integer
        lat:
          type: string
        lon:
          type: string
        fast_mode:
          type: boolean
        radius:
          type: integer
        depth:
          type: integer
        email:
          type: boolean
        max_time:
          type: integer
        proxies:
          type: array
          items:
            type: string

    ApiScrapeResponse:
      type: object
      properties:
        id:
          type: string

    Job:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        date:
          type: string
          format: date-time
        status:
          type: string
        data:
          $ref: '#/components/schemas/JobData'

    JobData:
      type: object
      properties:
        keywords:
          type: array
          items:
            type: string
        lang:
          type: string
        zoom:
          type: integer
        lat:
          type: string
        lon:
          type: string
        fast_mode:
          type: boolean
        radius:
          type: integer
        depth:
          type: integer
        email:
          type: boolean
        max_time:
          type: integer
        proxies:
          type: array
          items:
            type: string

