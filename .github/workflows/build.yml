name: build

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: prospects_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: shadowpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          check-latest: true

      - name: Go Format Check
        run: gofmt -s -w . && git diff --exit-code

      - name: Go Vet
        run: go vet ./...

      - name: Go Tidy Check
        run: go mod tidy && git diff --exit-code

      - name: Go Mod Verify
        run: go mod verify

      - name: Go Build
        run: go build -v ./...

      - name: Unit Tests
        run: go test -v -short ./...

      - name: Integration Tests (PostgreSQL Service Container)
        env:
          PROSPECT_DATABASE_URL: "postgres://postgres:shadowpass@127.0.0.1:5432/prospects_db?sslmode=disable"
        run: go test -v ./shadow/...
